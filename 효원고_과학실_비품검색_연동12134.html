<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>효원고 과학실 비품 검색</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --border: #1e3a5f;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 36px 18px 80px; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 32px; animation: fadeDown 0.6s ease both; }
  .logo-tag {
    display: inline-block; font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--accent); border: 1px solid var(--accent);
    padding: 4px 12px; border-radius: 2px;
    margin-bottom: 18px; opacity: 0.8;
  }
  h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; line-height: 1.2; margin-bottom: 8px; }
  h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { font-size: 13px; color: var(--text-muted); }

  .sync-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-family: 'Space Mono', monospace;
    color: var(--text-muted); margin-top: 8px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
  .sync-dot.loading { background: var(--warning); }
  .sync-dot.error { background: var(--danger); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .edit-mode-banner {
    display: none; background: linear-gradient(135deg, #7c3aed, #00d4ff);
    color: #fff; padding: 10px 18px; border-radius: 10px;
    margin-bottom: 18px; font-size: 13px; font-weight: 500;
    align-items: center; justify-content: space-between;
  }
  .edit-mode-banner.active { display: flex; }
  .edit-mode-banner button {
    background: rgba(0,0,0,0.3); border: none; color: #fff;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-family: inherit;
  }

  .top-actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .action-btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted);
    font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 18px; pointer-events: none; }
  #searchInput {
    width: 100%; padding: 16px 18px 16px 50px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 15px;
    font-family: inherit; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }

  .filter-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab {
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
    font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  .result-info {
    font-size: 11px; color: var(--text-muted);
    font-family: 'Space Mono', monospace; margin-bottom: 14px;
  }
  .result-info span { color: var(--accent); }

  #results { display: flex; flex-direction: column; gap: 10px; }
  .item-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 11px; padding: 16px 20px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px 14px;
    align-items: center; transition: all 0.2s;
    animation: fadeUp 0.3s ease both; position: relative;
  }
  .item-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.08); }
  .item-name { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
  .item-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; font-weight: 500; }
  .badge-floor { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
  .badge-location { font-size: 11px; color: var(--text-muted); font-family: 'Space Mono', monospace; }
  .badge-note { font-size: 11px; color: var(--warning); }
  .badge-purpose { font-size: 11px; color: #a78bfa; }
  .item-qty { text-align: right; min-width: 70px; }
  .qty-num { font-family: 'Space Mono', monospace; font-size: 19px; font-weight: 700; color: var(--accent); line-height: 1; }
  .qty-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  .edit-btn, .delete-btn {
    display: none; position: absolute; top: 10px;
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    cursor: pointer; font-size: 12px;
    align-items: center; justify-content: center;
  }
  .edit-btn { right: 10px; color: var(--accent); }
  .delete-btn { right: 44px; color: var(--danger); }
  .item-card.editable .edit-btn,
  .item-card.editable .delete-btn { display: flex; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 38px; margin-bottom: 10px; opacity: 0.4; }
  .loading-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { height: 1px; background: var(--border); margin: 28px 0; opacity: 0.5; }
  .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); font-family: 'Space Mono', monospace; line-height: 1.8; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 90%; max-width: 440px;
    animation: modalIn 0.3s ease;
  }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 18px; }
  .modal label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; margin-top: 12px; font-family: 'Space Mono', monospace; }
  .modal input {
    width: 100%; padding: 11px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    font-family: inherit; outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
  .btn-primary { background: var(--accent); border: none; color: #000; padding: 9px 18px; border-radius: 7px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 9px 18px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
  .error-msg.show { display: block; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--text); padding: 12px 22px; border-radius: 10px;
    font-size: 13px; z-index: 200;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-tag">HYOWON HIGH · SCIENCE LAB SYSTEM</div>
    <h1>효원고 과학실 <span>비품 검색</span></h1>
    <p class="subtitle">비품명·층·위치로 빠르게 검색하세요</p>
    <div class="sync-status">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">구글 시트와 실시간 동기화</span>
    </div>
  </header>

  <div id="editBanner" class="edit-mode-banner">
    <span>🔓 편집 모드 — 카드 우측 버튼으로 수정·삭제</span>
    <button onclick="exitEditMode()">종료</button>
  </div>

  <div class="top-actions">
    <button class="action-btn" onclick="reload()">🔄 새로고침</button>
    <button class="action-btn" onclick="openAuthModal()">🔑 편집 모드</button>
    <button id="addBtn" class="action-btn primary" style="display:none" onclick="openAddModal()">＋ 비품 추가</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="예: 비커, 시험관, 1-1, 시약..." autocomplete="off">
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="tab active" data-filter="전체">전체</button>
    <button class="tab" data-filter="1층 준비실">1층 준비실</button>
    <button class="tab" data-filter="2층 과학실">2층 과학실</button>
    <button class="tab" data-filter="3층 준비실">3층 준비실</button>
    <button class="tab" data-filter="4층 준비실">4층 준비실</button>
    <button class="tab" data-filter="시약장">시약장</button>
  </div>

  <div class="result-info">총 <span id="countNum">0</span>개 비품</div>
  <div id="results"></div>

  <div class="divider"></div>
  <div class="footer-note">
    수정 권한 문의: 과학 담당 선생님<br>
    데이터 출처: 구글 시트 실시간 연동
  </div>
</div>

<!-- 비번 모달 -->
<div id="authModal" class="modal-overlay">
  <div class="modal">
    <h2>편집 모드 진입</h2>
    <p>수정 권한 비밀번호를 입력하세요</p>
    <label>PASSWORD</label>
    <input type="password" id="pwInput" placeholder="••••" maxlength="10">
    <div id="authError" class="error-msg">비밀번호가 일치하지 않습니다</div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAuthModal()">취소</button>
      <button class="btn-primary" onclick="checkPassword()">확인</button>
    </div>
  </div>
</div>

<!-- 추가/수정 모달 -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h2 id="editModalTitle">비품 추가</h2>
    <p>각 항목을 입력해주세요</p>
    <label>비품명 *</label>
    <input type="text" id="edit-name">
    <label>층/위치 *</label>
    <input type="text" id="edit-floor" placeholder="예: 1층 준비실">
    <label>수량</label>
    <input type="text" id="edit-qty" placeholder="예: 15개">
    <label>세부 위치</label>
    <input type="text" id="edit-location" placeholder="예: 1-1 상단">
    <label>용도</label>
    <input type="text" id="edit-purpose">
    <label>기타 메모</label>
    <input type="text" id="edit-note">
    <div id="editError" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEditModal()">취소</button>
      <button class="btn-primary" id="saveBtn" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ⚠️ 아래 URL을 앱스 스크립트 배포 후 받은 URL로 바꿔주세요
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const API_URL = "https://script.google.com/macros/s/AKfycbwOBqZAyCmB5-sZxHprwDAsYWp1EeFSlxy5S5oLq-PH7NgzsLoWzp1SSDY6NuaxCELHVw/exec";
const PASSWORD = "0125";

let items = [];
let editMode = false;
let editRow = -1;
let activeFilter = "전체";
let searchQuery = "";

function setSyncStatus(state, text) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  dot.className = "sync-dot" + (state === "loading" ? " loading" : state === "error" ? " error" : "");
  txt.textContent = text;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function loadData() {
  setSyncStatus("loading", "데이터 불러오는 중...");
  document.getElementById("results").innerHTML = `<div class="loading-state"><div class="spinner"></div>구글 시트에서 데이터 불러오는 중...</div>`;
  try {
    const res = await fetch(API_URL + "?action=list");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    items = data.items || [];
    setSyncStatus("ok", `${items.length}개 비품 동기화됨 · ${new Date().toLocaleTimeString("ko-KR")}`);
    render();
  } catch (e) {
    setSyncStatus("error", "연결 실패: " + e.message);
    document.getElementById("results").innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>구글 시트 연결 실패<br><br>API_URL이 설정되었는지 확인하세요</p></div>`;
  }
}

function reload() { loadData(); }

// 비번
function openAuthModal() {
  document.getElementById("authModal").classList.add("active");
  document.getElementById("pwInput").value = "";
  document.getElementById("authError").classList.remove("show");
  setTimeout(() => document.getElementById("pwInput").focus(), 100);
}
function closeAuthModal() { document.getElementById("authModal").classList.remove("active"); }
function checkPassword() {
  const v = document.getElementById("pwInput").value;
  if (v === PASSWORD) {
    editMode = true;
    document.getElementById("editBanner").classList.add("active");
    document.getElementById("addBtn").style.display = "inline-block";
    closeAuthModal();
    showToast("편집 모드 진입 완료");
    render();
  } else {
    document.getElementById("authError").classList.add("show");
  }
}
function exitEditMode() {
  editMode = false;
  document.getElementById("editBanner").classList.remove("active");
  document.getElementById("addBtn").style.display = "none";
  render();
}

function openAddModal() {
  editRow = -1;
  document.getElementById("editModalTitle").textContent = "비품 추가";
  ["name","floor","qty","location","purpose","note"].forEach(k => document.getElementById("edit-"+k).value = "");
  document.getElementById("editError").classList.remove("show");
  document.getElementById("editModal").classList.add("active");
  setTimeout(() => document.getElementById("edit-name").focus(), 100);
}
function openEditModal(row) {
  editRow = row;
  const it = items.find(x => x._row === row);
  if (!it) return;
  document.getElementById("editModalTitle").textContent = "비품 수정";
  document.getElementById("edit-name").value = it.name || "";
  document.getElementById("edit-floor").value = it.floor || "";
  document.getElementById("edit-qty").value = it.qty || "";
  document.getElementById("edit-location").value = it.location || "";
  document.getElementById("edit-purpose").value = it.purpose || "";
  document.getElementById("edit-note").value = it.note || "";
  document.getElementById("editError").classList.remove("show");
  document.getElementById("editModal").classList.add("active");
}
function closeEditModal() { document.getElementById("editModal").classList.remove("active"); }

async function saveItem() {
  const item = {
    name: document.getElementById("edit-name").value.trim(),
    floor: document.getElementById("edit-floor").value.trim(),
    qty: document.getElementById("edit-qty").value.trim() || "미확인",
    location: document.getElementById("edit-location").value.trim() || "위치 미확인",
    purpose: document.getElementById("edit-purpose").value.trim(),
    note: document.getElementById("edit-note").value.trim(),
  };
  if (!item.name || !item.floor) {
    const err = document.getElementById("editError");
    err.textContent = "비품명과 층/위치는 필수입니다";
    err.classList.add("show");
    return;
  }
  
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "저장 중...";
  
  try {
    const body = editRow === -1
      ? { action: "add", password: PASSWORD, item: item }
      : { action: "update", password: PASSWORD, row: editRow, item: item };
    
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(body)
    });
    const data = await res.json();
    
    if (data.success) {
      closeEditModal();
      showToast(editRow === -1 ? "추가 완료" : "수정 완료");
      await loadData();
    } else {
      throw new Error(data.error || "저장 실패");
    }
  } catch (e) {
    const err = document.getElementById("editError");
    err.textContent = "저장 실패: " + e.message;
    err.classList.add("show");
  } finally {
    btn.disabled = false; btn.textContent = "저장";
  }
}

async function deleteItem(row) {
  const it = items.find(x => x._row === row);
  if (!it) return;
  if (!confirm(`"${it.name}" 항목을 삭제하시겠습니까?`)) return;
  
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "delete", password: PASSWORD, row: row })
    });
    const data = await res.json();
    if (data.success) {
      showToast("삭제 완료");
      await loadData();
    } else {
      throw new Error(data.error || "삭제 실패");
    }
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
}

function render() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = items.filter(it => {
    const matchSearch = !q ||
      (it.name || "").toString().toLowerCase().includes(q) ||
      (it.location || "").toString().toLowerCase().includes(q) ||
      (it.floor || "").toString().toLowerCase().includes(q) ||
      (it.purpose || "").toString().toLowerCase().includes(q);
    const matchFilter = activeFilter === "전체" || it.floor === activeFilter;
    return matchSearch && matchFilter;
  });

  document.getElementById("countNum").textContent = filtered.length;
  const container = document.getElementById("results");

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔬</div><p>검색 결과가 없습니다</p></div>`;
    return;
  }

  container.innerHTML = filtered.map((it, i) => `
    <div class="item-card ${editMode ? 'editable' : ''}" style="animation-delay:${Math.min(i*0.02,0.4)}s">
      ${editMode ? `<button class="delete-btn" onclick="deleteItem(${it._row})">🗑</button>` : ''}
      ${editMode ? `<button class="edit-btn" onclick="openEditModal(${it._row})">✏</button>` : ''}
      <div>
        <div class="item-name">${escapeHtml(it.name)}</div>
        <div class="item-meta">
          <span class="badge badge-floor">${escapeHtml(it.floor)}</span>
          <span class="badge-location">📍 ${escapeHtml(it.location)}</span>
          ${it.purpose ? `<span class="badge-purpose">· ${escapeHtml(it.purpose)}</span>` : ''}
          ${it.note ? `<span class="badge-note">⚠ ${escapeHtml(it.note)}</span>` : ''}
        </div>
      </div>
      <div class="item-qty">
        <div class="qty-num">${escapeHtml(it.qty)}</div>
        <div class="qty-label">수량</div>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("searchInput").addEventListener("input", e => { searchQuery = e.target.value; render(); });
document.getElementById("filterTabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  activeFilter = tab.dataset.filter;
  render();
});
document.getElementById("pwInput").addEventListener("keypress", e => { if (e.key === "Enter") checkPassword(); });

loadData();
</script>
</body>
</html>
